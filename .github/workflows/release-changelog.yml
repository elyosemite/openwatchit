name: Generate changelog on release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Generate changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog for ${{ github.ref_name }}
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: changelog/${{ github.ref_name }}.md

      - name: Open PR for changelog entry
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: changelog ${{ github.ref_name }}"
          title: "docs: changelog ${{ github.ref_name }}"
          body: |
            Automated changelog entry for `${{ github.ref_name }}` generated by git-cliff.
          branch: "changelog/${{ github.ref_name }}"
          delete-branch: true
          add-paths: changelog/${{ github.ref_name }}.md
          labels: changelog,automated

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
