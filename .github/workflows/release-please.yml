name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  changelog:
    name: Generate changelog entry
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh api repos/orhun/git-cliff/releases/latest --jq '.tag_name' | sed 's/^v//')
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 755 "$(find /tmp -name 'git-cliff' -type f | head -1)" /usr/local/bin/git-cliff

      - name: Generate changelog for ${{ needs.release-please.outputs.tag_name }}
        run: |
          git-cliff --config cliff.toml --latest \
            --output "changelog/${{ needs.release-please.outputs.tag_name }}.md"

      - name: Commit and push
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog/${{ needs.release-please.outputs.tag_name }}.md
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "docs: changelog ${{ needs.release-please.outputs.tag_name }}"
            git push origin HEAD:main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger website deployment
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-website.yml --ref main
